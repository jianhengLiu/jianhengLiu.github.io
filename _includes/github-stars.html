{% comment %}
  GitHub star badge from local _data/github_stars.yml (no external CDN).
  Usage: {% include github-stars.html repo="owner/repo" %}
{% endcomment %}
{% if include.repo %}
  {% assign stars = site.data.github_stars[include.repo] %}
  {% if stars %}
<a class="metric-badge metric-badge--stars" href="https://github.com/{{ include.repo }}" title="GitHub stars"><i class="fab fa-github" aria-hidden="true"></i> ★ {{ stars }}</a>
  {% endif %}
{% endif %}
