{%- comment -%}
  GitHub star count from _data/github_stars.yml (local, no CDN).
  Usage: {% include github-stars.html repo="owner/repo" %}
{%- endcomment -%}
{%- if include.repo -%}
{%- assign stars = site.data.github_stars[include.repo] -%}
{%- if stars -%}
<a class="metric metric--stars" href="https://github.com/{{ include.repo }}" title="{{ stars }} GitHub stars"><i class="fab fa-github" aria-hidden="true"></i><span class="metric__star" aria-hidden="true">★</span>{{ stars }}</a>
{%- endif -%}
{%- endif -%}
