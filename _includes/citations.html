{% comment %}
  Citation badge from local _data/citations.yml (no external CDN).
  Usage: {% include citations.html key="gs-sdf" %}
{% endcomment %}
{% if include.key %}
  {% assign cites = site.data.citations[include.key] %}
  {% if cites and cites > 0 %}
<span class="metric-badge metric-badge--cites" title="Google Scholar citations"><i class="ai ai-google-scholar" aria-hidden="true"></i> {{ cites }}</span>
  {% endif %}
{% endif %}
