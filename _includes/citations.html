{%- comment -%}
  Citation count from _data/citations.yml (local, no CDN).
  Usage: {% include citations.html key="gs-sdf" %}
{%- endcomment -%}
{%- if include.key -%}
{%- assign cites = site.data.citations[include.key] -%}
{%- if cites and cites > 0 -%}
<span class="metric metric--cites" title="{{ cites }} Google Scholar citations"><i class="ai ai-google-scholar" aria-hidden="true"></i>{{ cites }}</span>
{%- endif -%}
{%- endif -%}
