<style>
  .project-links {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem 0.85rem;
    margin: 0.45em 0 1em;
    font-size: 0.95em;
    line-height: 1.45;
  }
  .project-links__metrics {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.55rem;
    padding-left: 0.85rem;
    border-left: 1px solid #d0d7de;
    color: #57606a;
  }
  .project-links__metrics:empty {
    display: none;
  }
  .metric {
    display: inline-flex;
    align-items: center;
    gap: 0.18em;
    color: #57606a;
    font-size: 0.92em;
    font-weight: 600;
    line-height: 1;
    text-decoration: none;
    white-space: nowrap;
  }
  a.metric:hover {
    text-decoration: none;
    opacity: 0.75;
  }
  .metric__star {
    color: #e3a008;
  }
  .metric--cites {
    color: #2f6fdb;
  }
  .page__content li > .metric {
    margin-left: 0.35em;
  }
  .page__content li a + .metric {
    margin-left: 0.2em;
    margin-right: 0.15em;
  }
  .project-links > a + .metric {
    margin-left: -0.45rem;
    margin-right: 0.15rem;
  }
  .side-projects {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1rem;
    margin: 1em 0 2em;
  }
  .page__content a.side-project {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #e1e4e8;
    border-radius: 10px;
    color: inherit;
    text-decoration: none;
    transition: box-shadow 0.15s, transform 0.15s;
  }
  .page__content a.side-project:hover {
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    transform: translateY(-2px);
  }
  .side-project img {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: cover;
  }
  .side-project__body {
    display: flex;
    flex-direction: column;
    gap: 0.3em;
    padding: 0.8em 1em 1em;
    font-size: 0.85em;
    line-height: 1.5;
  }
  .side-project__body strong {
    font-size: 1.15em;
  }
  .side-project__body span {
    color: #57606a;
  }
  .side-project__body em {
    margin-top: auto;
    color: #2f6fdb;
    font-style: normal;
    font-size: 0.95em;
  }
</style>
