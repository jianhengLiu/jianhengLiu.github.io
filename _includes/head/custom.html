<style>
  .project-links {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem 0.85rem;
    margin: 0.45em 0 1em;
    font-size: 0.95em;
    line-height: 1.45;
  }
  .project-links__metrics {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.55rem;
    padding-left: 0.85rem;
    border-left: 1px solid #d0d7de;
    color: #57606a;
  }
  .metric {
    display: inline-flex;
    align-items: center;
    gap: 0.18em;
    color: #57606a;
    font-size: 0.92em;
    font-weight: 600;
    line-height: 1;
    text-decoration: none;
    white-space: nowrap;
  }
  a.metric:hover {
    text-decoration: none;
    opacity: 0.75;
  }
  .metric__star {
    color: #e3a008;
  }
  .metric--cites {
    color: #2f6fdb;
  }
  .page__content li > .metric {
    margin-left: 0.35em;
  }
  .page__content li a + .metric {
    margin-left: 0.2em;
    margin-right: 0.15em;
  }
  .project-links > a + .metric {
    margin-left: -0.45rem;
    margin-right: 0.15rem;
  }
</style>
